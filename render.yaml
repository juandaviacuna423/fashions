services:
  # ── BACKEND (Web Service - Node/Express API) ──────────────────────────────
  - type: web
    name: fashions-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && node db/seed.js
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "20"

  # ── FRONTEND (Static Site - React/Vite) ──────────────────────────────────
  - type: web
    name: fashions-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
