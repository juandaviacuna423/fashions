services:
  # ── BACKEND (Web Service - Node/Express API) ──────────────────────────────
  - type: web
    name: fashions-backend
    env: node
    rootDir: backend
    buildCommand: npm install && node db/seed.js
    startCommand: node server.js

  # ── FRONTEND (Static Site - React/Vite) ──────────────────────────────────
  - type: static
    name: fashions-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
